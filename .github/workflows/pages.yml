name: Publish demo to gh-pages

# Strona jest publikowana z gałęzi gh-pages (Settings → Pages → Deploy from
# a branch). Ten workflow po każdym pushu na branch roboczy wypycha aktualny
# stan witryny do gh-pages; wbudowany deployment "pages build and deployment"
# GitHuba zajmuje się resztą.

on:
  push:
    branches: [claude/plugin-install-setup-80bot7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push snapshot to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
